group 'com.razorpay.flutter_customui'
version '1.0'

buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.razorpay.flutter_customui'
    compileSdk 35

    defaultConfig {
        minSdkVersion 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    dependencies {
/*        implementation fileTree(include: ['*.jar'], dir: 'libs')
        implementation fileTree(dir: 'libs', include: ['*.aar'])
        implementation 'com.razorpay:customui:3.9.+'*/
        implementation "com.razorpay:customui:3.9.22"
        //implementation "com.razorpay:customui-core:3.9.22"
        implementation 'com.android.support:cardview-v7:28.0.0'

        implementation 'androidx.core:core-ktx:1.15.0'
        implementation 'com.google.android.material:material:1.12.0'
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation 'androidx.activity:activity:1.10.1'
        implementation 'androidx.activity:activity-ktx:1.10.1'
        implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
        implementation 'com.github.bumptech.glide:glide:4.16.0'
        implementation "androidx.fragment:fragment:1.8.6"

        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation "androidx.core:core-ktx:1.15.0"
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.10"
        implementation 'com.google.code.gson:gson:2.10.1'
        implementation 'io.sentry:sentry:8.4.0'
        implementation 'com.squareup.retrofit2:retrofit:2.11.0'
        implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
        implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
        //TODO: Add Library folder path in implementation's dir
        //compileOnly fileTree(include: ['*.aar'], dir: '')
    }
}


